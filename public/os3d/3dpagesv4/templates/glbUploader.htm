<script>
  var GUXFile = {
    dataURLtoFile: function (dataurl,filename) {

      var arr = dataurl.split(','),
        mime = arr[0].match(/:(.*?);/)[1],
        bstr = atob(arr[1]),
        n = bstr.length,
        u8arr = new Uint8Array(n);

      while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
      }

      return new File([u8arr],filename,{ type: mime });
    },
    upload: function (evt,fn,files,apipath) {

      if (first('#glbtit').innerHTML == 'please wait ...') return;

      first('#glbtit').innerHTML = 'please wait ...';
      first('#glbdsc').innerHTML = '';

      ctl = evt.currentTarget;

      if (files) {
        evt.currentTarget.files = files;
      }

      var change = def(fn,function (a,b) { });

      if (GUX.file.state != 'ready') {
        if (confirm('another upload in progress .please wait and cancel this confirm to finish and try again. or you can cancel ?')) {
          GUXFile.state = 'ready';
        };
      }
      else {
        GUXFile.state = 'start';
        try {

          GUXFile.xhr(evt,change,apipath);
        }
        catch (e) {

          GUXFile.state = 'ready';
        }
      }
    },
    postFile: function (path,success,op) {

      function processData(data) {
        // taking care of data
        if (def(success)) {

          success(data);
        }
      }

      function handler() {
        if (this.readyState == this.DONE) {
          if (this.status == 200) {
            // success!
            processData(this.responseText);
          }
          else {
            // something went wrong

            alert(this.responseText);
          }
        }
      }

      var client = new XMLHttpRequest();
      client.onreadystatechange = handler;

      if ("withCredentials" in client) {

        // Check if the XMLHttpRequest object has a "withCredentials" property.
        // "withCredentials" only exists on XMLHTTPRequest2 objects.

        client.open("POST",path,true);
        client.setRequestHeader("Authorization","Bearer " + window.os3dapi.sample.token);

        client.upload.onprogress = function (pe) {
          if (pe.lengthComputable) {
            op.progress = def(op.progress,function (p) { });
            op.progress(pe.loaded * 100. / pe.total);
          }
        }

      } else if (typeof XDomainRequest != "undefined") {

        // Otherwise, check if XDomainRequest.
        // XDomainRequest only exists in IE, and is IE's way of making CORS requests.
        client = new XDomainRequest();
        client.onreadystatechange = handler;

        client.open("POST",path);
        client.setRequestHeader("Authorization","Bearer " + window.os3dapi.sample.token);

        client.upload.onprogress = function (pe) {
          if (pe.lengthComputable) {
            op.progress = def(op.progress,function (p) { });
            op.progress(pe.loaded * 100. / pe.total);
          }
        }
      }

      if (def(op.file)) {

        var data = new FormData();

        _for(op.file,function (at,i) {
          data.append("file",at.data);

        },function () {
          client.setRequestHeader("content",JSON.stringify(op.data));
          client.send(data);
        });
      }
    },
    xhr: function (evt,change,apipath) {
      ctl = evt.currentTarget;
      var rd = new FileReader();
      _tid = 0;
      embeds = [];

      var files = evt.currentTarget.files;
      GUXFile.state = 'reading';
      new th_for(files,
        function (tid,it) {
          _tid = tid;

          rd.onload = function (ev) {

            if (!GUXFile.embeds) GUXFile.embeds = [];
            GUXFile.embeds.push({ url: ev.target.result,data: null });

            n_1(GUXFile.embeds).data = it.item;
            th_e(_tid);
            change(evt.currentTarget,{ type: 'reading' });
          }

          rd.readAsDataURL(it.item);

        },
        function () {
          GUXFile.state = 'sending';

          // xhr req

          var service = os3dapi.domain + '/file' + def(apipath,'/glb');
          // api/xmp3/1?obj=1&prp=mvideo&tlt=unknown&P1=xmp3

          GUXFile.postFile(service,function (d) {

            console.log('dddddd',d)

            change(d);


            GUXFile.embeds = new Array();
            GUXFile.state = 'ready';
            ctl.title = "100%";

            first('.iprg',null,ctl.parentNode).style.width = '0%';

            first('#glbtit').innerHTML = 'Upload ';
            first('#glbdsc').innerHTML = 'Browse From Your Device';


          },{
            file: GUXFile.embeds,data: {},progress: function (p) {
              first('.iprg',null,ctl.parentNode).style.width = p + '%';
              ctl.title = p + "%";

              first('#glbdsc').innerHTML = floor(p * 100.) / 100. + " %";
            }
          });
        }).start();
    }
  }

</script>
