<script>
    var prop;

    window.stat = function (st,p3,p,p2) {
        document.getElementById('status').innerHTML = '<span class="c-tgray">' + st + ' </span><span class="c-tblue">' + (p || '') + ' </span><span class="c-tgray">' + (p2 || '') + ' </span><br/><span class="c-tgray2">' + (p3 || '') + '</span>';
    }

    function addEventHandler(obj,evt,handler) {
        if (obj.addEventListener) {
            // W3C method
            obj.addEventListener(evt,handler,false);
        } else if (obj.attachEvent) {
            // IE method.
            obj.attachEvent('on' + evt,handler);
        } else {
            // Old school method.
            obj['on' + evt] = handler;
        }
    }

    var defDrag = function (dragdiv,str) {

        dragdiv.setAttribute('draggable','true');
        dragdiv.addEventListener('dragstart',function (event) {
            var th = this;
            th.classList.add('op0');

            event.dataTransfer.effectAllowed = "copyMove";

            canvas_scene.dragState = true;
            canvas_scene.dragedItem = str;
            event.dataTransfer.setData("text",JSON.stringify(str));

        });

        dragdiv.addEventListener('dragend',function (event) {
            canvas_scene.drop()

        });

    }

    var clearTempList = function (name,item) {
        all('.' + item,function (at) {
            if (at.className.indexOf(name) == -1) at.remove();
        },function () { },null,first('.' + name).parent);
    }



    function createTempElement(name,op,par) {
        var temp = document.querySelector(name);
        var div = document.createElement('div');

        var sTemp = temp.innerHTML;
        div.className = temp.className.replace('hdn-i','').replace(name.replace('.',''),'');

        for (var item in op) {
            sTemp = sTemp.replaceAll('[#' + item + ']',op[item]);
        }

        sTemp = sTemp.replaceAll('[#src]','src');
        sTemp = sTemp.replaceAll('[#href]','href');

        div.innerHTML = sTemp;

        if (op.dragable) {

            div.className += ' rt';
            var dg = document.createElement('div');
            dg.className = 'ab t-00 l-00 h-full w-full  z10';
            dg.innerHTML = ' ';
            div.appendChild(dg);
            defDrag(dg,op.dragable);

        } else if (op.click) {
            div.className += ' rt';
            div.onclick = op.click;
        }

        if (par) par.appendChild(div)

        else temp.parentNode.appendChild(div);
        return div;
    }


    var selectTab = function (th) {

        var showTab = th.parentNode.className.indexOf('d3tabselected') != -1;

        var items = document.querySelectorAll('.d3tabselected');
        if (items.length > 0)
            for (var item in items) {
                if (items[item] && items[item].classList)
                    items[item].classList.remove('d3tabselected')
            }


        if (!showTab)
            th.parentNode.classList.add('d3tabselected');
        else th.parentNode.classList.remove('d3tabselected');
    }

    window.onCallFromParent = (event) => {

        console.log('get from parent :',event);

        if (event.data && event.data.type == 'create')
            prop.scene.createModel(event.data);
        if (event.data && event.data.type == 'delete')
            prop.scene.deleteModel(event.data);
        if (event.data && event.data.type == 'save')
            prop.scene.saveTemp(event.data);
        if (event.data && event.data.type == 'load')
            prop.scene.loadTemp(event.data);

        if (event.data && event.data.type == 'camera')
            prop.scene.controlCamera(event.data);

    }

    new $3dsrv().canvas(document.getElementById('renderCanvas'),function (p) {

        p.scene.postMessage = function (msg) {
            window.postMessage(msg,'*')
        }

        prop = p;

        canvas_scene = prop.scene;

        window.addEventListener("message",prop.onCallFromParent,false);


    },{

        .xxx-t,.xxx-t-h:hover{ color: #yyy ;}
        .xxx-b,.xxx-b-h:hover{ border-color: #yyy ;}

        .xxx-h-i:hover,.xxx-t-h-i:hover{ cursor: pointer !important; }
        .xxx-t-i,.xxx-t-h-i:hover{ color: #yyy !important;}
        .xxx-b-i,.xxx-b-h-i:hover{ border-color: #yyy !important;}
        
        `.replaceAll('xxx',n).replaceAll('#yyy',c);
    }

</script>
